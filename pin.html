<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钉住的图片</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      #container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        cursor: default;
      }

      #image {
        display: block;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: inherit;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      #close-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        border-radius: 12px;
        background: rgba(255, 59, 48, 0.9);
        border: none;
        color: white;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 10;
      }

      #container:hover #close-btn,
      #container:focus-within #close-btn {
        opacity: 1;
      }

      #close-btn:hover {
        background: rgba(255, 59, 48, 1);
      }

      .resize-handle {
        position: absolute;
        width: 18px;
        height: 18px;
        border: 0;
        background: transparent;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 9;
      }

      #container:hover .resize-handle,
      #container:focus-within .resize-handle {
        opacity: 1;
      }

      .resize-handle::before {
        content: '';
        position: absolute;
        inset: 4px;
        border-right: 2px solid rgba(255, 255, 255, 0.72);
        border-bottom: 2px solid rgba(255, 255, 255, 0.72);
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
      }

      .resize-handle[data-direction='NorthWest'] {
        top: 0;
        left: 0;
        cursor: nwse-resize;
        transform: rotate(180deg);
      }

      .resize-handle[data-direction='NorthEast'] {
        top: 0;
        right: 0;
        cursor: nesw-resize;
        transform: rotate(270deg);
      }

      .resize-handle[data-direction='SouthWest'] {
        bottom: 0;
        left: 0;
        cursor: nesw-resize;
        transform: rotate(90deg);
      }

      .resize-handle[data-direction='SouthEast'] {
        right: 0;
        bottom: 0;
        cursor: nwse-resize;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <img id="image" alt="钉住的图片" />
      <button id="close-btn" title="关闭">×</button>
      <button class="resize-handle" data-direction="NorthWest" aria-label="调整贴图左上角大小"></button>
      <button class="resize-handle" data-direction="NorthEast" aria-label="调整贴图右上角大小"></button>
      <button class="resize-handle" data-direction="SouthWest" aria-label="调整贴图左下角大小"></button>
      <button class="resize-handle" data-direction="SouthEast" aria-label="调整贴图右下角大小"></button>
    </div>

    <script type="module">
      import { getCurrentWindow, LogicalSize, PhysicalSize } from '@tauri-apps/api/window';
      import { convertFileSrc } from '@tauri-apps/api/core';

      const container = document.getElementById('container');
      const image = document.getElementById('image');
      const closeBtn = document.getElementById('close-btn');
      const resizeHandles = document.querySelectorAll('.resize-handle');
      const currentWin = getCurrentWindow();

      let scale = 1;

      async function runWindowAction(action, label) {
        try {
          await action();
        } catch (error) {
          console.error(`${label}失败:`, error);
        }
      }

      // 从 URL 参数获取图片路径
      const urlParams = new URLSearchParams(window.location.search);
      const imagePath = urlParams.get('path');

      if (imagePath) {
        const imageUrl = convertFileSrc(imagePath);
        image.src = imageUrl;
      } else {
        console.error('未提供图片路径');
      }

      // 图片加载完成后调整窗口大小
      image.onload = () => {
        const naturalWidth = image.naturalWidth;
        const naturalHeight = image.naturalHeight;

        // 限制初始大小，最大 800x600
        let width = naturalWidth;
        let height = naturalHeight;

        if (width > 800 || height > 600) {
          const ratio = Math.min(800 / width, 600 / height);
          width = Math.floor(width * ratio);
          height = Math.floor(height * ratio);
        }

        runWindowAction(
          () => currentWin.setSize(new LogicalSize(width, height)),
          '调整贴图窗口大小'
        );
      };

      image.onerror = (e) => {
        console.error('图片加载失败:', e);
        image.alt = '图片加载失败';
      };

      // Ctrl + 滚轮缩放
      container.addEventListener('wheel', async (e) => {
        if (e.ctrlKey) {
          e.preventDefault();

          const delta = e.deltaY < 0 ? 1.1 : 0.9;
          scale *= delta;

          // 限制缩放范围
          scale = Math.max(0.1, Math.min(scale, 5));

          const size = await currentWin.innerSize();
          const newWidth = Math.floor(size.width * delta);
          const newHeight = Math.floor(size.height * delta);

          await runWindowAction(
            () => currentWin.setSize(new PhysicalSize(
              Math.max(50, Math.min(newWidth, 2000)),
              Math.max(50, Math.min(newHeight, 2000))
            )),
            '缩放贴图'
          );
        }
      }, { passive: false });

      // 拖动窗口
      container.addEventListener('pointerdown', async (e) => {
        if (e.button !== 0) return;
        if (e.target.closest('button')) return;

        await runWindowAction(() => currentWin.startDragging(), '移动贴图');
      });

      resizeHandles.forEach((handle) => {
        handle.addEventListener('pointerdown', async (e) => {
          if (e.button !== 0) return;

          e.preventDefault();
          e.stopPropagation();
          await runWindowAction(
            () => currentWin.startResizeDragging(handle.dataset.direction),
            '缩放贴图窗口'
          );
        });
      });

      // 关闭按钮
      closeBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await runWindowAction(() => currentWin.close(), '关闭贴图');
      });

      // ESC 关闭
      document.addEventListener('keydown', async (e) => {
        if (e.key === 'Escape') {
          await runWindowAction(() => currentWin.close(), '关闭贴图');
        }
      });
    </script>
  </body>
</html>
