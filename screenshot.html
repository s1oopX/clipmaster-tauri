<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>区域截图</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        user-select: none;
        background: #05070c;
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        cursor: crosshair;
      }

      #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      #info,
      #error,
      #toolbar,
      #textInput,
      #sizeInfo {
        position: absolute;
        z-index: 10;
      }

      #info {
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 7px 12px;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.86);
        color: #e2e8f0;
        font-size: 12px;
        pointer-events: none;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.26);
      }

      #error {
        top: 52px;
        left: 50%;
        display: none;
        max-width: min(560px, calc(100vw - 32px));
        transform: translateX(-50%);
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(185, 28, 28, 0.94);
        color: #fff;
        font-size: 13px;
        box-shadow: 0 18px 42px rgba(127, 29, 29, 0.28);
      }

      #toolbar {
        display: none;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        max-width: calc(100vw - 16px);
        padding: 5px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.94);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
      }

      #toolbar button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #dbeafe;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }

      #toolbar button:hover,
      #toolbar button.active {
        background: rgba(56, 189, 248, 0.18);
        color: #ffffff;
      }

      #toolbar button.primary {
        background: #22c55e;
        color: #052e16;
      }

      #toolbar button.primary:hover {
        background: #4ade80;
      }

      #toolbar button:disabled {
        opacity: 0.48;
        cursor: default;
      }

      .toolbar-divider {
        width: 1px;
        height: 22px;
        margin: 0 3px;
        background: rgba(148, 163, 184, 0.26);
      }

      #textInput {
        display: none;
        width: min(220px, calc(100vw - 24px));
        min-height: 30px;
        padding: 5px 8px;
        border: 1px solid rgba(56, 189, 248, 0.88);
        border-radius: 6px;
        outline: none;
        background: rgba(15, 23, 42, 0.96);
        color: #f8fafc;
        font-size: 16px;
        font-weight: 650;
        box-shadow: 0 16px 38px rgba(0, 0, 0, 0.34);
      }

      #sizeInfo {
        display: none;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(15, 23, 42, 0.88);
        color: #e2e8f0;
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="info">拖动框选区域 | Enter / Ctrl+C 复制保存 | Ctrl+Z 撤销 | Esc 取消</div>
    <div id="error" role="alert" aria-live="assertive"></div>
    <canvas id="canvas"></canvas>
    <div id="toolbar">
      <button id="selectTool" data-tool="select" class="active" aria-label="选择和调整选区">选择</button>
      <button id="rectTool" data-tool="rect" aria-label="矩形标注">矩形</button>
      <button id="arrowTool" data-tool="arrow" aria-label="箭头标注">箭头</button>
      <button id="penTool" data-tool="pen" aria-label="画笔标注">画笔</button>
      <button id="textTool" data-tool="text" aria-label="文字标注">文字</button>
      <button id="stepTool" data-tool="step" aria-label="步骤编号">编号</button>
      <button id="blurTool" data-tool="blur" aria-label="模糊遮挡">模糊</button>
      <button id="pixelateTool" data-tool="pixelate" aria-label="马赛克遮挡">马赛克</button>
      <button id="eraserTool" data-tool="eraser" aria-label="擦除标注">橡皮</button>
      <div class="toolbar-divider"></div>
      <button id="undoBtn" aria-label="撤销上一处标注" disabled>撤销</button>
      <button id="redoBtn" aria-label="重做上一处标注" disabled>重做</button>
      <div class="toolbar-divider"></div>
      <button id="reselectBtn" aria-label="清空标注并重新框选">重新框选</button>
      <button id="pinBtn" aria-label="保存并钉到桌面">钉住</button>
      <button id="confirm" class="primary" aria-label="复制到剪贴板并保存历史">复制保存</button>
      <button id="cancel" aria-label="取消截图">取消</button>
    </div>
    <input id="textInput" type="text" maxlength="80" aria-label="输入文字标注" />
    <div id="sizeInfo"></div>

    <script type="module">
      import { convertFileSrc, invoke } from '@tauri-apps/api/core';
      import { getCurrentWindow, Window } from '@tauri-apps/api/window';

      const HANDLE_SIZE = 9;
      const MIN_SELECTION_SIZE = 10;
      const ANNOTATION_COLOR = '#ef4444';
      const PRIVACY_MASK_MIN_SIZE = 6;
      const PIXELATE_BLOCK_SIZE = 10;
      const TEXT_FONT_SIZE = 18;
      const STEP_MARKER_RADIUS = 13;
      const ERASER_HIT_RADIUS = 8;

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const toolbar = document.getElementById('toolbar');
      const errorBox = document.getElementById('error');
      const sizeInfo = document.getElementById('sizeInfo');
      const info = document.getElementById('info');
      const confirmBtn = document.getElementById('confirm');
      const cancelBtn = document.getElementById('cancel');
      const pinBtn = document.getElementById('pinBtn');
      const reselectBtn = document.getElementById('reselectBtn');
      const undoBtn = document.getElementById('undoBtn');
      const redoBtn = document.getElementById('redoBtn');
      const textInput = document.getElementById('textInput');
      const toolButtons = [...document.querySelectorAll('[data-tool]')];

      const params = new URLSearchParams(window.location.search);
      const snapshot = {
        path: params.get('snapshotPath') || '',
        screenX: numberParam('screenX', 0),
        screenY: numberParam('screenY', 0),
        screenWidth: numberParam('screenWidth', window.innerWidth),
        screenHeight: numberParam('screenHeight', window.innerHeight),
        pixelWidth: numberParam('pixelWidth', window.innerWidth),
        pixelHeight: numberParam('pixelHeight', window.innerHeight),
        scaleFactor: numberParam('scaleFactor', 1),
      };
      const shouldRestoreMainWindow = params.get('restoreMainWindow') !== '0';

      const frozenImage = new Image();
      let imageReady = false;
      let activeTool = 'select';
      let isCapturing = false;
      let snapshotCleaned = false;
      let selection = null;
      let dragState = null;
      let activeAnnotation = null;
      let pendingTextAnnotation = null;
      let annotations = [];
      let historyStack = [];
      let redoStack = [];

      function numberParam(key, fallback) {
        const parsed = Number(params.get(key));
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function pointFromEvent(event) {
        return {
          x: clamp(event.clientX, 0, canvas.width),
          y: clamp(event.clientY, 0, canvas.height),
        };
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function normalizeRect(rect) {
        const x = Math.min(rect.x, rect.x + rect.width);
        const y = Math.min(rect.y, rect.y + rect.height);
        return {
          x,
          y,
          width: Math.abs(rect.width),
          height: Math.abs(rect.height),
        };
      }

      function clampSelection(rect) {
        const normalized = normalizeRect(rect);
        const width = Math.min(normalized.width, canvas.width);
        const height = Math.min(normalized.height, canvas.height);
        return {
          x: clamp(normalized.x, 0, canvas.width - width),
          y: clamp(normalized.y, 0, canvas.height - height),
          width,
          height,
        };
      }

      function clampPointToSelection(point) {
        if (!selection) return point;
        return {
          x: clamp(point.x, selection.x, selection.x + selection.width),
          y: clamp(point.y, selection.y, selection.y + selection.height),
        };
      }

      function isUsableSelection(rect = selection) {
        return rect && rect.width >= MIN_SELECTION_SIZE && rect.height >= MIN_SELECTION_SIZE;
      }

      function resizeCanvas() {
        canvas.width = Math.max(1, Math.round(window.innerWidth));
        canvas.height = Math.max(1, Math.round(window.innerHeight));
        if (selection) {
          selection = clampSelection(selection);
        }
        drawCanvas();
        positionToolbar();
        positionTextInput();
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function hideError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      async function restoreMainWindow() {
        if (!shouldRestoreMainWindow) {
          return true;
        }

        try {
          const mainWindow = await Window.getByLabel('main');
          if (!mainWindow) {
            console.warn('未找到主窗口');
            return false;
          }

          const shown = await runWindowAction(() => mainWindow.show(), '恢复主窗口显示');
          const focused = await runWindowAction(() => mainWindow.setFocus(), '恢复主窗口焦点');
          return shown && focused;
        } catch (error) {
          console.error('恢复主窗口失败:', error);
          return false;
        }
      }

      async function runWindowAction(action, label) {
        try {
          await action();
          return true;
        } catch (error) {
          console.error(`${label}失败:`, error);
          return false;
        }
      }

      function setActiveTool(tool) {
        if (tool !== 'text') {
          commitTextInput();
        }
        activeTool = tool;
        toolButtons.forEach((button) => {
          button.classList.toggle('active', button.dataset.tool === tool);
        });
        canvas.style.cursor = tool === 'select' ? 'default' : tool === 'eraser' ? 'cell' : 'crosshair';
      }

      function resetForReselect() {
        cancelTextInput();
        selection = null;
        annotations = [];
        historyStack = [];
        redoStack = [];
        activeAnnotation = null;
        dragState = null;
        toolbar.style.display = 'none';
        sizeInfo.style.display = 'none';
        setActiveTool('select');
        updateHistoryButtons();
        drawCanvas();
      }

      function commitAnnotation(annotation) {
        const index = annotations.length;
        annotations.push(annotation);
        historyStack.push({ type: 'add', annotation, index });
        redoStack = [];
        updateHistoryButtons();
      }

      function removeAnnotation(index) {
        if (index < 0 || index >= annotations.length) return false;
        const [annotation] = annotations.splice(index, 1);
        historyStack.push({ type: 'remove', annotation, index });
        redoStack = [];
        updateHistoryButtons();
        return true;
      }

      function undoAnnotation() {
        if (isCapturing || activeAnnotation || pendingTextAnnotation || historyStack.length === 0) return;
        const action = historyStack.pop();
        revertHistoryAction(action);
        redoStack.push(action);
        updateHistoryButtons();
        drawCanvas();
        positionToolbar();
      }

      function redoAnnotation() {
        if (isCapturing || activeAnnotation || pendingTextAnnotation || redoStack.length === 0) return;
        const action = redoStack.pop();
        applyHistoryAction(action);
        historyStack.push(action);
        updateHistoryButtons();
        drawCanvas();
        positionToolbar();
      }

      function applyHistoryAction(action) {
        if (action.type === 'add') {
          annotations.splice(Math.min(action.index, annotations.length), 0, action.annotation);
        } else if (action.type === 'remove') {
          removeAnnotationByReference(action.annotation, action.index);
        }
      }

      function revertHistoryAction(action) {
        if (action.type === 'add') {
          removeAnnotationByReference(action.annotation, action.index);
        } else if (action.type === 'remove') {
          annotations.splice(Math.min(action.index, annotations.length), 0, action.annotation);
        }
      }

      function removeAnnotationByReference(annotation, fallbackIndex) {
        if (annotations[fallbackIndex] === annotation) {
          annotations.splice(fallbackIndex, 1);
          return;
        }

        const index = annotations.indexOf(annotation);
        if (index >= 0) {
          annotations.splice(index, 1);
        }
      }

      function updateHistoryButtons() {
        undoBtn.disabled = isCapturing || historyStack.length === 0;
        redoBtn.disabled = isCapturing || redoStack.length === 0;
      }

      function getHandles(rect = selection) {
        if (!rect) return [];
        const cx = rect.x + rect.width / 2;
        const cy = rect.y + rect.height / 2;
        const right = rect.x + rect.width;
        const bottom = rect.y + rect.height;

        return [
          ['nw', rect.x, rect.y],
          ['n', cx, rect.y],
          ['ne', right, rect.y],
          ['e', right, cy],
          ['se', right, bottom],
          ['s', cx, bottom],
          ['sw', rect.x, bottom],
          ['w', rect.x, cy],
        ];
      }

      function hitHandle(point) {
        return getHandles().find(([, x, y]) => {
          return Math.abs(point.x - x) <= HANDLE_SIZE && Math.abs(point.y - y) <= HANDLE_SIZE;
        })?.[0] || null;
      }

      function pointInSelection(point) {
        return Boolean(
          selection &&
            point.x >= selection.x &&
            point.x <= selection.x + selection.width &&
            point.y >= selection.y &&
            point.y <= selection.y + selection.height
        );
      }

      function selectionFromHandle(handle, startRect, point) {
        const left = startRect.x;
        const top = startRect.y;
        const right = startRect.x + startRect.width;
        const bottom = startRect.y + startRect.height;
        const next = { x: left, y: top, width: startRect.width, height: startRect.height };

        if (handle.includes('w')) {
          next.x = point.x;
          next.width = right - point.x;
        }
        if (handle.includes('e')) {
          next.width = point.x - left;
        }
        if (handle.includes('n')) {
          next.y = point.y;
          next.height = bottom - point.y;
        }
        if (handle.includes('s')) {
          next.height = point.y - top;
        }

        return clampSelection(next);
      }

      function moveSelection(startRect, deltaX, deltaY) {
        selection = {
          ...startRect,
          x: clamp(startRect.x + deltaX, 0, canvas.width - startRect.width),
          y: clamp(startRect.y + deltaY, 0, canvas.height - startRect.height),
        };
      }

      function nudgeSelection(deltaX, deltaY, resize = false) {
        if (!selection || isCapturing) return;

        if (resize) {
          selection = clampSelection({
            ...selection,
            width: Math.max(MIN_SELECTION_SIZE, selection.width + deltaX),
            height: Math.max(MIN_SELECTION_SIZE, selection.height + deltaY),
          });
        } else {
          moveSelection(selection, deltaX, deltaY);
        }

        drawCanvas();
        positionToolbar();
      }

      function drawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (imageReady) {
          ctx.drawImage(frozenImage, 0, 0, canvas.width, canvas.height);
        } else {
          ctx.fillStyle = '#05070c';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        if (!selection) {
          ctx.fillStyle = 'rgba(2, 6, 23, 0.28)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          return;
        }

        drawOutsideOverlay(selection);

        ctx.save();
        ctx.beginPath();
        ctx.rect(selection.x, selection.y, selection.width, selection.height);
        ctx.clip();
        annotations.forEach((annotation) => drawAnnotation(ctx, annotation));
        if (activeAnnotation) {
          drawAnnotation(ctx, activeAnnotation);
        }
        ctx.restore();

        drawSelectionFrame(selection);
        drawSizeInfo();
      }

      function drawOutsideOverlay(rect) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.48)';
        ctx.fillRect(0, 0, canvas.width, rect.y);
        ctx.fillRect(0, rect.y + rect.height, canvas.width, canvas.height - rect.y - rect.height);
        ctx.fillRect(0, rect.y, rect.x, rect.height);
        ctx.fillRect(rect.x + rect.width, rect.y, canvas.width - rect.x - rect.width, rect.height);
      }

      function drawSelectionFrame(rect) {
        ctx.save();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.width, rect.height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 1;
        ctx.strokeRect(rect.x + 3.5, rect.y + 3.5, Math.max(0, rect.width - 6), Math.max(0, rect.height - 6));

        for (const [, x, y] of getHandles(rect)) {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(x - HANDLE_SIZE / 2, y - HANDLE_SIZE / 2, HANDLE_SIZE, HANDLE_SIZE);
          ctx.strokeStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.strokeRect(x - HANDLE_SIZE / 2 + 0.5, y - HANDLE_SIZE / 2 + 0.5, HANDLE_SIZE - 1, HANDLE_SIZE - 1);
        }
        ctx.restore();
      }

      function drawSizeInfo() {
        if (!isUsableSelection()) return;
        const logicalWidth = Math.round(selection.width);
        const logicalHeight = Math.round(selection.height);
        const pixelWidth = Math.round(selection.width * pixelScaleX());
        const pixelHeight = Math.round(selection.height * pixelScaleY());
        sizeInfo.textContent = `${logicalWidth} × ${logicalHeight} / ${pixelWidth} × ${pixelHeight}`;
        sizeInfo.style.display = 'block';
        sizeInfo.style.left = `${Math.min(selection.x + selection.width + 10, canvas.width - 148)}px`;
        sizeInfo.style.top = `${Math.max(8, selection.y)}px`;
      }

      function drawAnnotation(targetCtx, annotation, transform = identityTransform()) {
        const lineWidth = Math.max(2, 3 * transform.avgScale);
        targetCtx.save();
        targetCtx.strokeStyle = ANNOTATION_COLOR;
        targetCtx.fillStyle = ANNOTATION_COLOR;
        targetCtx.lineWidth = lineWidth;
        targetCtx.lineJoin = 'round';
        targetCtx.lineCap = 'round';

        if (annotation.type === 'blur' || annotation.type === 'pixelate') {
          drawPrivacyMask(targetCtx, annotation, transform);
        } else if (annotation.type === 'rect') {
          const rect = normalizeRect(annotation);
          const x = tx(rect.x, transform);
          const y = ty(rect.y, transform);
          targetCtx.strokeRect(
            x,
            y,
            rect.width * transform.scaleX,
            rect.height * transform.scaleY
          );
        } else if (annotation.type === 'arrow') {
          drawArrow(
            targetCtx,
            tx(annotation.x1, transform),
            ty(annotation.y1, transform),
            tx(annotation.x2, transform),
            ty(annotation.y2, transform),
            14 * transform.avgScale
          );
        } else if (annotation.type === 'pen' && annotation.points.length > 1) {
          targetCtx.beginPath();
          targetCtx.moveTo(tx(annotation.points[0].x, transform), ty(annotation.points[0].y, transform));
          for (const point of annotation.points.slice(1)) {
            targetCtx.lineTo(tx(point.x, transform), ty(point.y, transform));
          }
          targetCtx.stroke();
        } else if (annotation.type === 'text') {
          drawTextLabel(targetCtx, annotation, transform);
        } else if (annotation.type === 'step') {
          drawStepMarker(targetCtx, annotation, transform);
        }

        targetCtx.restore();
      }

      function drawTextLabel(targetCtx, annotation, transform) {
        const fontSize = Math.max(12, Math.round(TEXT_FONT_SIZE * transform.avgScale));
        const x = tx(annotation.x, transform);
        const y = ty(annotation.y, transform);

        targetCtx.font = `750 ${fontSize}px Inter, ui-sans-serif, system-ui, sans-serif`;
        targetCtx.textBaseline = 'top';
        targetCtx.lineJoin = 'round';
        targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
        targetCtx.lineWidth = Math.max(3, Math.round(4 * transform.avgScale));
        targetCtx.strokeText(annotation.text, x, y);
        targetCtx.fillStyle = ANNOTATION_COLOR;
        targetCtx.fillText(annotation.text, x, y);
      }

      function drawStepMarker(targetCtx, annotation, transform) {
        const x = tx(annotation.x, transform);
        const y = ty(annotation.y, transform);
        const radius = Math.max(9, STEP_MARKER_RADIUS * transform.avgScale);

        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.arc(x, y, radius, 0, Math.PI * 2);
        targetCtx.fillStyle = ANNOTATION_COLOR;
        targetCtx.fill();
        targetCtx.lineWidth = Math.max(2, 2 * transform.avgScale);
        targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.96)';
        targetCtx.stroke();

        targetCtx.fillStyle = '#ffffff';
        targetCtx.font = `800 ${Math.max(11, Math.round(14 * transform.avgScale))}px Inter, ui-sans-serif, system-ui, sans-serif`;
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(String(annotation.value), x, y + 0.5 * transform.avgScale);
        targetCtx.restore();
      }

      function drawPrivacyMask(targetCtx, annotation, transform) {
        const rect = normalizeRect(annotation);
        const x = tx(rect.x, transform);
        const y = ty(rect.y, transform);
        const width = rect.width * transform.scaleX;
        const height = rect.height * transform.scaleY;
        if (width < 1 || height < 1) return;

        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.rect(x, y, width, height);
        targetCtx.clip();

        if (annotation.type === 'blur') {
          drawBlurredRegion(targetCtx, x, y, width, height, transform.avgScale);
        } else {
          drawPixelatedRegion(targetCtx, x, y, width, height, transform.avgScale);
        }

        targetCtx.restore();
      }

      function drawBlurredRegion(targetCtx, x, y, width, height, scale) {
        const padding = Math.max(4, Math.round(8 * scale));
        const sourceX = Math.floor(clamp(x - padding, 0, targetCtx.canvas.width));
        const sourceY = Math.floor(clamp(y - padding, 0, targetCtx.canvas.height));
        const sourceWidth = Math.max(1, Math.min(targetCtx.canvas.width - sourceX, Math.ceil(width + padding * 2)));
        const sourceHeight = Math.max(1, Math.min(targetCtx.canvas.height - sourceY, Math.ceil(height + padding * 2)));
        const sample = document.createElement('canvas');
        sample.width = sourceWidth;
        sample.height = sourceHeight;
        const sampleCtx = sample.getContext('2d');

        sampleCtx.drawImage(
          targetCtx.canvas,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          sourceWidth,
          sourceHeight
        );

        targetCtx.save();
        targetCtx.filter = `blur(${Math.max(4, 8 * scale)}px)`;
        targetCtx.drawImage(sample, 0, 0, sourceWidth, sourceHeight, sourceX, sourceY, sourceWidth, sourceHeight);
        targetCtx.restore();
      }

      function drawPixelatedRegion(targetCtx, x, y, width, height, scale) {
        const sourceX = Math.floor(clamp(x, 0, targetCtx.canvas.width));
        const sourceY = Math.floor(clamp(y, 0, targetCtx.canvas.height));
        const sourceWidth = Math.max(1, Math.min(targetCtx.canvas.width - sourceX, Math.ceil(width)));
        const sourceHeight = Math.max(1, Math.min(targetCtx.canvas.height - sourceY, Math.ceil(height)));
        const blockSize = Math.max(4, Math.round(PIXELATE_BLOCK_SIZE * scale));
        const smallWidth = Math.max(1, Math.ceil(sourceWidth / blockSize));
        const smallHeight = Math.max(1, Math.ceil(sourceHeight / blockSize));
        const sample = document.createElement('canvas');
        sample.width = smallWidth;
        sample.height = smallHeight;
        const sampleCtx = sample.getContext('2d');

        sampleCtx.imageSmoothingEnabled = true;
        sampleCtx.drawImage(
          targetCtx.canvas,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          smallWidth,
          smallHeight
        );

        targetCtx.save();
        targetCtx.imageSmoothingEnabled = false;
        targetCtx.drawImage(
          sample,
          0,
          0,
          smallWidth,
          smallHeight,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight
        );
        targetCtx.restore();
      }

      function drawArrow(targetCtx, x1, y1, x2, y2, headLength) {
        const angle = Math.atan2(y2 - y1, x2 - x1);
        targetCtx.beginPath();
        targetCtx.moveTo(x1, y1);
        targetCtx.lineTo(x2, y2);
        targetCtx.stroke();

        targetCtx.beginPath();
        targetCtx.moveTo(x2, y2);
        targetCtx.lineTo(
          x2 - headLength * Math.cos(angle - Math.PI / 6),
          y2 - headLength * Math.sin(angle - Math.PI / 6)
        );
        targetCtx.lineTo(
          x2 - headLength * Math.cos(angle + Math.PI / 6),
          y2 - headLength * Math.sin(angle + Math.PI / 6)
        );
        targetCtx.closePath();
        targetCtx.fill();
      }

      function identityTransform() {
        return {
          offsetX: 0,
          offsetY: 0,
          scaleX: 1,
          scaleY: 1,
          avgScale: 1,
        };
      }

      function tx(value, transform) {
        return (value - transform.offsetX) * transform.scaleX;
      }

      function ty(value, transform) {
        return (value - transform.offsetY) * transform.scaleY;
      }

      function pixelScaleX() {
        return snapshot.pixelWidth / Math.max(1, canvas.width);
      }

      function pixelScaleY() {
        return snapshot.pixelHeight / Math.max(1, canvas.height);
      }

      function beginTextAnnotation(point) {
        commitTextInput();
        pendingTextAnnotation = {
          type: 'text',
          x: point.x,
          y: point.y,
        };
        textInput.value = '';
        positionTextInput();
        textInput.style.display = 'block';
        textInput.focus();
      }

      function positionTextInput() {
        if (!pendingTextAnnotation) return;
        const inputWidth = Math.min(220, Math.max(120, canvas.width - 24));
        textInput.style.width = `${inputWidth}px`;
        textInput.style.left = `${clamp(pendingTextAnnotation.x, 8, canvas.width - inputWidth - 8)}px`;
        textInput.style.top = `${clamp(pendingTextAnnotation.y - TEXT_FONT_SIZE - 12, 8, canvas.height - 38)}px`;
      }

      function commitTextInput() {
        if (!pendingTextAnnotation) return;
        const text = textInput.value.trim();
        const annotation = pendingTextAnnotation;
        pendingTextAnnotation = null;
        textInput.value = '';
        textInput.style.display = 'none';

        if (text) {
          commitAnnotation({ ...annotation, text });
          drawCanvas();
          positionToolbar();
        }
      }

      function cancelTextInput() {
        pendingTextAnnotation = null;
        textInput.value = '';
        textInput.style.display = 'none';
      }

      function nextStepNumber() {
        return annotations
          .filter((annotation) => annotation.type === 'step')
          .reduce((maxValue, annotation) => Math.max(maxValue, Number(annotation.value) || 0), 0) + 1;
      }

      function eraseAnnotationAt(point) {
        const index = findAnnotationIndexAtPoint(point);
        if (index < 0) return false;
        const removed = removeAnnotation(index);
        if (removed) {
          drawCanvas();
          positionToolbar();
        }
        return removed;
      }

      function findAnnotationIndexAtPoint(point) {
        for (let index = annotations.length - 1; index >= 0; index -= 1) {
          if (hitTestAnnotation(annotations[index], point)) {
            return index;
          }
        }
        return -1;
      }

      function hitTestAnnotation(annotation, point) {
        if (annotation.type === 'rect') {
          return hitTestRectOutline(annotation, point);
        }
        if (annotation.type === 'blur' || annotation.type === 'pixelate') {
          return pointInExpandedRect(point, normalizeRect(annotation), ERASER_HIT_RADIUS);
        }
        if (annotation.type === 'arrow') {
          return distanceToSegment(point, { x: annotation.x1, y: annotation.y1 }, { x: annotation.x2, y: annotation.y2 }) <= ERASER_HIT_RADIUS;
        }
        if (annotation.type === 'pen') {
          return annotation.points.some((current, index) => {
            if (index === 0) return false;
            return distanceToSegment(point, annotation.points[index - 1], current) <= ERASER_HIT_RADIUS;
          });
        }
        if (annotation.type === 'text') {
          return pointInExpandedRect(point, textAnnotationBounds(annotation), ERASER_HIT_RADIUS);
        }
        if (annotation.type === 'step') {
          return Math.hypot(point.x - annotation.x, point.y - annotation.y) <= STEP_MARKER_RADIUS + ERASER_HIT_RADIUS;
        }
        return false;
      }

      function hitTestRectOutline(annotation, point) {
        const rect = normalizeRect(annotation);
        const outer = pointInExpandedRect(point, rect, ERASER_HIT_RADIUS);
        const inner = pointInExpandedRect(point, {
          x: rect.x + ERASER_HIT_RADIUS,
          y: rect.y + ERASER_HIT_RADIUS,
          width: Math.max(0, rect.width - ERASER_HIT_RADIUS * 2),
          height: Math.max(0, rect.height - ERASER_HIT_RADIUS * 2),
        }, 0);
        return outer && !inner;
      }

      function pointInExpandedRect(point, rect, padding) {
        return (
          point.x >= rect.x - padding &&
          point.x <= rect.x + rect.width + padding &&
          point.y >= rect.y - padding &&
          point.y <= rect.y + rect.height + padding
        );
      }

      function textAnnotationBounds(annotation) {
        ctx.save();
        ctx.font = `750 ${TEXT_FONT_SIZE}px Inter, ui-sans-serif, system-ui, sans-serif`;
        const width = Math.max(12, ctx.measureText(annotation.text).width);
        ctx.restore();
        return {
          x: annotation.x,
          y: annotation.y,
          width,
          height: TEXT_FONT_SIZE + 4,
        };
      }

      function distanceToSegment(point, start, end) {
        const deltaX = end.x - start.x;
        const deltaY = end.y - start.y;
        const lengthSquared = deltaX * deltaX + deltaY * deltaY;
        if (lengthSquared === 0) {
          return Math.hypot(point.x - start.x, point.y - start.y);
        }

        const t = clamp(
          ((point.x - start.x) * deltaX + (point.y - start.y) * deltaY) / lengthSquared,
          0,
          1
        );
        return Math.hypot(point.x - (start.x + t * deltaX), point.y - (start.y + t * deltaY));
      }

      function renderFinalDataUrl() {
        if (!isUsableSelection()) {
          throw new Error('请先选择截图区域');
        }

        const scaleX = pixelScaleX();
        const scaleY = pixelScaleY();
        const sourceX = Math.round(selection.x * scaleX);
        const sourceY = Math.round(selection.y * scaleY);
        const sourceWidth = Math.max(1, Math.round(selection.width * scaleX));
        const sourceHeight = Math.max(1, Math.round(selection.height * scaleY));
        const output = document.createElement('canvas');
        output.width = sourceWidth;
        output.height = sourceHeight;
        const outputCtx = output.getContext('2d');

        outputCtx.drawImage(
          frozenImage,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          0,
          0,
          sourceWidth,
          sourceHeight
        );

        outputCtx.save();
        outputCtx.beginPath();
        outputCtx.rect(0, 0, sourceWidth, sourceHeight);
        outputCtx.clip();
        const transform = {
          offsetX: selection.x,
          offsetY: selection.y,
          scaleX,
          scaleY,
          avgScale: (scaleX + scaleY) / 2,
        };
        annotations.forEach((annotation) => drawAnnotation(outputCtx, annotation, transform));
        outputCtx.restore();

        return output.toDataURL('image/png');
      }

      function positionToolbar() {
        if (!isUsableSelection()) {
          toolbar.style.display = 'none';
          return;
        }

        toolbar.style.display = 'flex';
        const maxLeft = Math.max(8, canvas.width - toolbar.offsetWidth - 8);
        const left = clamp(selection.x + selection.width - toolbar.offsetWidth, 8, maxLeft);
        let top = selection.y + selection.height + 10;

        if (top + toolbar.offsetHeight > canvas.height) {
          top = selection.y - toolbar.offsetHeight - 10;
        }
        toolbar.style.left = `${left}px`;
        toolbar.style.top = `${clamp(top, 8, Math.max(8, canvas.height - toolbar.offsetHeight - 8))}px`;
      }

      function updateCursor(event) {
        if (activeTool !== 'select' || !selection || dragState) return;
        const point = pointFromEvent(event);
        const handle = hitHandle(point);
        const cursors = {
          n: 'ns-resize',
          s: 'ns-resize',
          e: 'ew-resize',
          w: 'ew-resize',
          nw: 'nwse-resize',
          se: 'nwse-resize',
          ne: 'nesw-resize',
          sw: 'nesw-resize',
        };
        canvas.style.cursor = handle ? cursors[handle] : pointInSelection(point) ? 'move' : 'crosshair';
      }

      function onMouseDown(event) {
        if (isCapturing || !imageReady) return;
        hideError();
        const point = pointFromEvent(event);

        if (activeTool === 'select') {
          commitTextInput();
          const handle = hitHandle(point);
          if (selection && handle) {
            dragState = {
              type: 'resize',
              handle,
              startPoint: point,
              startSelection: { ...selection },
            };
          } else if (selection && pointInSelection(point)) {
            dragState = {
              type: 'move',
              startPoint: point,
              startSelection: { ...selection },
            };
          } else {
            selection = { x: point.x, y: point.y, width: 0, height: 0 };
            annotations = [];
            historyStack = [];
            redoStack = [];
            cancelTextInput();
            updateHistoryButtons();
            dragState = {
              type: 'create',
              startPoint: point,
            };
          }
          drawCanvas();
          return;
        }

        if (!selection || !pointInSelection(point)) return;
        const clippedPoint = clampPointToSelection(point);

        if (activeTool === 'rect') {
          activeAnnotation = {
            type: 'rect',
            x: clippedPoint.x,
            y: clippedPoint.y,
            width: 0,
            height: 0,
          };
          dragState = { type: 'annotation', startPoint: clippedPoint };
        } else if (activeTool === 'arrow') {
          activeAnnotation = {
            type: 'arrow',
            x1: clippedPoint.x,
            y1: clippedPoint.y,
            x2: clippedPoint.x,
            y2: clippedPoint.y,
          };
          dragState = { type: 'annotation', startPoint: clippedPoint };
        } else if (activeTool === 'pen') {
          activeAnnotation = {
            type: 'pen',
            points: [clippedPoint],
          };
          dragState = { type: 'annotation', startPoint: clippedPoint };
        } else if (activeTool === 'text') {
          beginTextAnnotation(clippedPoint);
        } else if (activeTool === 'step') {
          commitAnnotation({
            type: 'step',
            x: clippedPoint.x,
            y: clippedPoint.y,
            value: nextStepNumber(),
          });
          drawCanvas();
          positionToolbar();
        } else if (activeTool === 'blur' || activeTool === 'pixelate') {
          activeAnnotation = {
            type: activeTool,
            x: clippedPoint.x,
            y: clippedPoint.y,
            width: 0,
            height: 0,
          };
          dragState = { type: 'annotation', startPoint: clippedPoint };
        } else if (activeTool === 'eraser') {
          eraseAnnotationAt(clippedPoint);
          dragState = { type: 'erase' };
        }
      }

      function onMouseMove(event) {
        if (!dragState) {
          updateCursor(event);
          return;
        }

        const point = pointFromEvent(event);

        if (dragState.type === 'create') {
          selection = clampSelection({
            x: dragState.startPoint.x,
            y: dragState.startPoint.y,
            width: point.x - dragState.startPoint.x,
            height: point.y - dragState.startPoint.y,
          });
        } else if (dragState.type === 'move') {
          moveSelection(
            dragState.startSelection,
            point.x - dragState.startPoint.x,
            point.y - dragState.startPoint.y
          );
        } else if (dragState.type === 'resize') {
          selection = selectionFromHandle(
            dragState.handle,
            dragState.startSelection,
            point
          );
        } else if (dragState.type === 'annotation' && activeAnnotation) {
          const clippedPoint = clampPointToSelection(point);
          if (activeAnnotation.type === 'rect') {
            activeAnnotation.width = clippedPoint.x - dragState.startPoint.x;
            activeAnnotation.height = clippedPoint.y - dragState.startPoint.y;
          } else if (activeAnnotation.type === 'blur' || activeAnnotation.type === 'pixelate') {
            activeAnnotation.width = clippedPoint.x - dragState.startPoint.x;
            activeAnnotation.height = clippedPoint.y - dragState.startPoint.y;
          } else if (activeAnnotation.type === 'arrow') {
            activeAnnotation.x2 = clippedPoint.x;
            activeAnnotation.y2 = clippedPoint.y;
          } else if (activeAnnotation.type === 'pen') {
            activeAnnotation.points.push(clippedPoint);
          }
        } else if (dragState.type === 'erase' && selection && pointInSelection(point)) {
          eraseAnnotationAt(clampPointToSelection(point));
        }

        drawCanvas();
        positionToolbar();
      }

      function onMouseUp() {
        if (!dragState) return;

        if (dragState.type === 'create') {
          if (!isUsableSelection()) {
            selection = null;
            toolbar.style.display = 'none';
            sizeInfo.style.display = 'none';
          }
        } else if (dragState.type === 'annotation' && activeAnnotation) {
          const shouldKeep =
            activeAnnotation.type === 'pen'
              ? activeAnnotation.points.length > 1
              : activeAnnotation.type === 'rect' || activeAnnotation.type === 'blur' || activeAnnotation.type === 'pixelate'
                ? Math.abs(activeAnnotation.width) >= PRIVACY_MASK_MIN_SIZE && Math.abs(activeAnnotation.height) >= PRIVACY_MASK_MIN_SIZE
                : Math.hypot(activeAnnotation.x2 - activeAnnotation.x1, activeAnnotation.y2 - activeAnnotation.y1) > 3;

          if (shouldKeep) {
            commitAnnotation(activeAnnotation);
          }
          activeAnnotation = null;
        }

        dragState = null;
        drawCanvas();
        positionToolbar();
      }

      async function saveSelection() {
        if (isCapturing) return null;
        commitTextInput();
        if (!isUsableSelection()) {
          showError('请先选择截图区域');
          return null;
        }

        isCapturing = true;
        hideError();
        setToolbarDisabled(true);

        try {
          const imageDataUrl = renderFinalDataUrl();
          const item = await invoke('save_screenshot_image', {
            imageDataUrl,
            snapshotPath: snapshot.path,
          });
          snapshotCleaned = true;
          return item;
        } catch (error) {
          console.error('截图失败:', error);
          showError('截图失败: ' + error);
          isCapturing = false;
          setToolbarDisabled(false);
          return null;
        }
      }

      async function confirmSelection() {
        const item = await saveSelection();
        if (item) {
          await closeWindow(false);
        }
      }

      async function pinSelection() {
        const item = await saveSelection();
        if (!item) return;

        try {
          if (item.image_path) {
            await invoke('pin_image', { imagePath: item.image_path });
          }
          await closeWindow(false);
        } catch (error) {
          console.error('钉住截图失败:', error);
          showError('钉住截图失败: ' + error);
          isCapturing = false;
          setToolbarDisabled(false);
        }
      }

      function setToolbarDisabled(disabled) {
        [...toolbar.querySelectorAll('button')].forEach((button) => {
          button.disabled = disabled;
        });
        textInput.disabled = disabled;
        if (!disabled) {
          updateHistoryButtons();
        }
      }

      async function cleanupSnapshot() {
        if (!snapshot.path || snapshotCleaned) return;
        snapshotCleaned = true;
        try {
          await invoke('cleanup_screenshot_snapshot', { snapshotPath: snapshot.path });
        } catch (error) {
          console.warn('清理冻结截图失败:', error);
        }
      }

      async function closeWindow(shouldCleanup = true) {
        const currentWin = getCurrentWindow();
        if (shouldCleanup) {
          await cleanupSnapshot();
        }

        const restored = await restoreMainWindow();
        if (!restored) {
          console.warn('主窗口恢复失败，继续关闭截图窗口');
        }

        const closed = await runWindowAction(() => currentWin.close(), '关闭截图窗口');
        if (closed) return;

        const destroyed = await runWindowAction(() => currentWin.destroy(), '强制关闭截图窗口');
        if (!destroyed) {
          isCapturing = false;
          setToolbarDisabled(false);
          showError('关闭截图窗口失败，请按 Alt+F4 退出');
        }
      }

      canvas.addEventListener('mousedown', onMouseDown);
      canvas.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      window.addEventListener('resize', resizeCanvas);

      confirmBtn.addEventListener('click', confirmSelection);
      pinBtn.addEventListener('click', pinSelection);
      cancelBtn.addEventListener('click', () => closeWindow(true));
      reselectBtn.addEventListener('click', resetForReselect);
      undoBtn.addEventListener('click', undoAnnotation);
      redoBtn.addEventListener('click', redoAnnotation);
      textInput.addEventListener('keydown', (event) => {
        event.stopPropagation();
        if (event.key === 'Enter') {
          event.preventDefault();
          commitTextInput();
        } else if (event.key === 'Escape') {
          event.preventDefault();
          cancelTextInput();
          drawCanvas();
          positionToolbar();
          canvas.focus();
        }
      });
      textInput.addEventListener('blur', commitTextInput);

      toolButtons.forEach((button) => {
        button.addEventListener('click', () => setActiveTool(button.dataset.tool));
      });

      document.addEventListener('keydown', (event) => {
        if (pendingTextAnnotation && event.key === 'Escape') {
          event.preventDefault();
          cancelTextInput();
          drawCanvas();
          positionToolbar();
          return;
        }

        if (event.key === 'Escape') {
          event.preventDefault();
          closeWindow(true);
          return;
        }

        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
          event.preventDefault();
          if (event.shiftKey) {
            redoAnnotation();
          } else {
            undoAnnotation();
          }
          return;
        }

        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y') {
          event.preventDefault();
          redoAnnotation();
          return;
        }

        if ((event.key === 'Enter' || (event.ctrlKey && event.key.toLowerCase() === 'c')) && selection) {
          event.preventDefault();
          confirmSelection();
          return;
        }

        if ((event.key === 'p' || event.key === 'P') && selection) {
          event.preventDefault();
          pinSelection();
          return;
        }

        const arrows = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1],
        };
        if (selection && arrows[event.key]) {
          event.preventDefault();
          const [deltaX, deltaY] = arrows[event.key];
          nudgeSelection(deltaX, deltaY, event.shiftKey);
        }
      });

      resizeCanvas();

      if (!snapshot.path) {
        showError('冻结屏幕失败: 缺少快照路径');
      } else {
        frozenImage.onload = () => {
          imageReady = true;
          info.style.display = 'block';
          drawCanvas();
        };
        frozenImage.onerror = () => {
          showError('冻结屏幕加载失败，请重试');
        };
        frozenImage.src = convertFileSrc(snapshot.path);
      }
    </script>
  </body>
</html>
