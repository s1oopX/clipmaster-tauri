name: Bug report
description: Report a reproducible ClipMaster problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not paste passwords, tokens, private screenshots, or sensitive clipboard content.
  - type: input
    id: version
    attributes:
      label: ClipMaster version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Write the smallest sequence that triggers the issue.
      placeholder: |
        1. Open ClipMaster
        2. Copy ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots are welcome if they do not contain sensitive data.
