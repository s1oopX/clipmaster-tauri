name: Feature request
description: Suggest an improvement for ClipMaster.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or pain point should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Clipboard history
        - Image workflow
        - Screenshot workflow
        - Privacy and security
        - Packaging and updates
        - UI and accessibility
        - Documentation
    validations:
      required: true
