[package]
name = "clipmaster"
version = "0.1.7"
description = "ClipMaster - 轻量级剪贴板管理工具"
authors = ["s1oopX", "Codex"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", default-features = false, features = ["time"] }
chrono = "0.4"
chrono-tz = "0.10"
nanoid = "0.4"
md5 = "0.7"
anyhow = "1.0"
parking_lot = "0.12"
arboard = "3.4"
image = "0.25"
screenshots = "0.8.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.48", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
